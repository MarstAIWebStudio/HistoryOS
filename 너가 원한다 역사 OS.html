<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>역사 OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px 14px 140px;display:flex;justify-content:center;align-items:flex-start;color:#111;font-family:Tahoma,Gulim,"굴림",Dotum,"돋움","Malgun Gothic","Segoe UI","Segoe UI Emoji",sans-serif;background:radial-gradient(ellipse 140% 55% at 30% 105%,#4c9a1e 0 55%,transparent 56%),radial-gradient(ellipse 120% 45% at 90% 110%,#3f8a16 0 55%,transparent 56%),linear-gradient(#2f6fd6,#6fb2f2 55%,#c9e6ff);background-attachment:fixed}
button,input{font-family:inherit}
.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fx span{position:absolute;bottom:-70px;font-size:54px;opacity:.8;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-115vh)}}
.wrap{position:relative;z-index:1;width:100%;max-width:480px}
.wrap.max{max-width:none}
.win{border:3px solid #0a4fd0;border-radius:10px 10px 4px 4px;background:#0a4fd0;box-shadow:4px 6px 0 rgba(0,0,0,.3);overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;padding:6px 8px;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(#3a8cff,#0a5fe0 45%,#0a4fd0)}
.tb b{flex:1}
.tb i{font-style:normal;width:22px;height:22px;line-height:20px;text-align:center;border:1px solid #fff;border-radius:4px;background:linear-gradient(#5aa0ff,#1f62d8);font-size:13px;cursor:pointer;user-select:none}
.tb i.x{background:linear-gradient(#f08a6a,#c9411c)}
.card{--text:#111;--sub:#444;--line:#7f9db9;--ok:#1a7f37;--no:#c62828;--accent:#c0392b;background:#ece9d8;color:#111;padding:20px}
.center{text-align:center}
.big{font-size:56px;font-weight:800;color:var(--accent);text-align:center;margin:6px 0}
.msg{font-size:18px;margin:8px 0 14px}
.step{color:var(--sub);font-size:14px;margin-bottom:12px}
.q{font-size:19px;font-weight:700;line-height:1.5;margin:0 0 16px}
.bar{height:14px;background:#fff;border:1px solid #7f9db9;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;transition:width .3s;background:repeating-linear-gradient(90deg,#3ba83b 0 10px,#ece9d8 10px 12px)}
.opt{display:block;width:100%;text-align:left;font-size:16px;color:#111;background:linear-gradient(#fff,#e6e2cf);border:2px solid #003c74;border-radius:4px;padding:14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:#f5a623}
.opt.ok{border-color:var(--ok);background:#d6f0dc}
.opt.no{border-color:var(--no);background:#f8d7d7}
.fb{min-height:24px;font-weight:700;margin:4px 0 10px}
.btn{width:100%;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(#6cc04a,#2f8a1e);border:2px solid #1d5c12;border-radius:4px;padding:14px;cursor:pointer}
.in{width:100%;font-size:17px;text-align:center;color:#111;background:#fff;border:2px solid #7f9db9;border-radius:2px;padding:10px;margin-bottom:8px}
.lb{font-size:14px;color:#444;margin:4px 0}
.err{color:var(--no);min-height:22px;font-size:14px;margin-bottom:6px}
.list{text-align:left;font-size:15px;margin:0 0 18px;padding:0;list-style:none}
.list li{padding:6px 0;border-bottom:1px solid #7f9db9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mc{aspect-ratio:1;font-size:32px;background:linear-gradient(#fff,#e6e2cf);border:2px solid #003c74;border-radius:4px;cursor:pointer;padding:0}
.mc.up{background:#fff}.mc.ok{background:#d6f0dc;border-color:#1a7f37}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:52px;height:52px;margin:0 auto 10px}
.logo s{display:block}
.logo s:nth-child(1){background:#f25022}.logo s:nth-child(2){background:#7fba00}.logo s:nth-child(3){background:#00a4ef}.logo s:nth-child(4){background:#ffb900}
.ld{width:170px;height:14px;border:2px solid #9a9a9a;border-radius:5px;overflow:hidden;background:#fff;margin:12px auto 0;position:relative}
.ld i{position:absolute;top:1px;bottom:1px;width:50px;background:repeating-linear-gradient(90deg,#3a7be0 0 10px,transparent 10px 13px);animation:sl 1.1s linear infinite}
@keyframes sl{from{left:-50px}to{left:100%}}
#boot{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#boot .logo{width:84px;height:84px;gap:4px}
#boot .bt{font-size:30px;font-weight:700;margin-top:6px}
#boot .bt em{color:#ff8a3d}
#boot .ld{background:#000}
#dsk{position:fixed;z-index:2;top:calc(16px + env(safe-area-inset-top,0px));left:10px;max-height:calc(100vh - 110px);display:flex;flex-direction:column;flex-wrap:wrap;gap:10px}
.icon{width:84px;text-align:center;cursor:pointer;color:#fff;font-size:13px;text-shadow:1px 1px 2px #000;padding:6px 2px;border:1px solid transparent}
.icon div{font-size:44px;line-height:1.1}
.icon:hover,.icon:active{background:rgba(49,106,197,.45);border:1px dotted #fff}
.taskbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:6px;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(#3a8cff,#245edb 15%,#1f4fc4)}
.taskbar button{font-weight:700;font-size:14px;color:#fff;border:1px solid #0a3a8c;border-radius:4px;padding:6px 12px;cursor:pointer}
.taskbar .st{background:linear-gradient(#5fbf4a,#2f8a1e);font-style:italic;border-radius:0 12px 12px 0}
.taskbar .tk{background:linear-gradient(#2f6fe0,#1b4fbf);max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gb{flex:1;font-size:20px;font-weight:700;padding:12px 0;color:#111;background:linear-gradient(#fff,#e6e2cf);border:2px solid #003c74;border-radius:4px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.gb:active{background:#cfd8ef}
#sm{display:none;position:fixed;left:6px;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:6;width:230px;border:3px solid #0a4fd0;border-radius:8px 8px 0 0;background:#fff;box-shadow:4px 4px 0 rgba(0,0,0,.3);overflow-y:auto;max-height:calc(100vh - 120px)}
.sh{background:linear-gradient(#3a8cff,#0a4fd0);color:#fff;font-weight:700;padding:10px 12px}
.si{padding:12px;font-size:15px;cursor:pointer;border-bottom:1px solid #e3e3e3}
.si:hover,.si:active{background:#316ac5;color:#fff}
.sf{position:sticky;bottom:0;background:linear-gradient(#4d86e8,#2a5fcf);padding:6px 8px;display:flex;align-items:center;gap:6px;color:#fff;font-size:12px}
.pwb{width:26px;height:26px;border-radius:5px;border:1px solid #fff;background:linear-gradient(#f5936f,#c9411c);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
#dlg{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:16px}
.dw{width:100%;max-width:330px;border:3px solid #0a4fd0;border-radius:8px 8px 3px 3px;background:#ece9d8;box-shadow:4px 6px 0 rgba(0,0,0,.35);overflow:hidden}
.db{display:flex;gap:12px;align-items:center;padding:18px 14px;font-size:15px;line-height:1.5}
.db span{font-size:40px}
.dbt{display:flex;justify-content:center;gap:10px;padding:0 14px 16px}
.dbt button{min-width:84px;padding:8px 0;font-size:15px;font-weight:700;background:linear-gradient(#fff,#e6e2cf);border:2px solid #003c74;border-radius:4px;cursor:pointer}
#off{display:none;position:fixed;inset:0;z-index:200;background:#000;color:#ccc}
#offt{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:18px}
#pw{display:none;position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border-radius:50%;border:2px solid #555;background:#1a1a1a;color:#8f8;font-size:18px;cursor:pointer;padding:0}
.taskbar .clk{margin-left:auto;color:#fff;font-size:13px;background:#1a8ae6;padding:6px 10px;border-radius:3px}
</style>
</head>
<body>
<div id="boot"><div class="logo"><s></s><s></s><s></s><s></s></div><div class="bt">역사 <em>OS</em></div><div class="ld"><i></i></div></div>
<div class="fx" id="fx"></div>
<div id="dsk"></div>
<div class="taskbar"><button class="st" id="st">▶ 시작</button><button class="tk" id="tk" style="display:none"></button><span class="clk" id="clk"></span></div>
<div id="sm"></div>
<div id="dlg"><div class="dw"><div class="tb"><span>⚠️</span><b>경고</b></div><div class="db"><span>⚠️</span><div>컴퓨터를 종료할까요?<br>열려 있는 창이 모두 닫혀요.</div></div><div class="dbt"><button id="dok">확인</button><button id="dno">취소</button></div></div></div>
<div id="off"><div id="offt">종료하는 중...</div><button id="pw" title="전원 켜기">⏻</button></div>
<div class="wrap" id="wrap">
  <div class="win" id="win" style="display:none">
    <div class="tb"><span>🗂️</span><b id="ttl"></b><i id="bmin" title="최소화">_</i><i id="bmax" title="최대화">□</i><i id="bx" class="x" title="닫기">✕</i></div>
    <div class="card" id="app"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
const ALL=[
{q:"고조선을 세운 사람은 누구일까요?",o:["주몽","단군왕검","온조","박혁거세"],a:1,e:"단군왕검이 우리나라 최초의 나라 고조선을 세웠어요."},
{q:"살수대첩에서 수나라 군대를 크게 물리친 고구려 장군은?",o:["을지문덕","연개소문","김유신","계백"],a:0,e:"을지문덕 장군이 살수대첩에서 승리했어요."},
{q:"918년 고려를 세운 왕은 누구일까요?",o:["이성계","궁예","왕건","견훤"],a:2,e:"왕건이 고려를 세우고 후삼국을 통일했어요."},
{q:"우리 글자 훈민정음을 만든 왕은?",o:["세종대왕","태조","정조","영조"],a:0,e:"세종대왕이 백성을 위해 훈민정음을 만들었어요."},
{q:"임진왜란 때 거북선을 이끌고 활약한 장군은?",o:["권율","김시민","이순신","곽재우"],a:2,e:"이순신 장군은 거북선으로 왜군을 물리쳤어요."},
{q:"676년 신라가 삼국 통일을 완성했을 때의 왕은?",o:["진흥왕","문무왕","선덕여왕","무열왕"],a:1,e:"문무왕 때 신라가 삼국 통일을 이루었어요."},
{q:"고구려의 영토를 크게 넓힌 왕은 누구일까요?",o:["근초고왕","무령왕","광개토대왕","성왕"],a:2,e:"광개토대왕이 고구려의 영토를 크게 넓혔어요."},
{q:"1392년 조선을 세운 사람은?",o:["이성계","정도전","이방원","왕건"],a:0,e:"이성계가 조선을 세우고 첫 번째 왕(태조)이 되었어요."},
{q:"1919년 3월 1일에 전국에서 일어난 독립운동은?",o:["6·10 만세 운동","3·1 운동","광주 학생 항일 운동","국채 보상 운동"],a:1,e:"3·1 운동은 온 국민이 대한 독립 만세를 외친 운동이에요."},
{q:"우리나라가 일본에서 벗어나 광복을 맞은 날은?",o:["1945년 8월 15일","1948년 8월 15일","1950년 6월 25일","1919년 3월 1일"],a:0,e:"1945년 8월 15일에 광복을 맞았어요."}
];
['🏔️','🏹','👑','📖','🐢','🌊','🐎','🏯','✊','🇰🇷'].forEach((c,k)=>ALL[k].ic=c);
let Q=[],N=5,i=0,score=0,log=[],name='',tm=null,cur=null;
const app=$('app'),winEl=$('win'),dsk=$('dsk'),tk=$('tk'),wrapEl=$('wrap');
const LOGO='<div class="logo"><s></s><s></s><s></s><s></s></div>';

/* 배경 구름 */
for(let k=0;k<8;k++){const s=document.createElement('span');s.textContent='☁️';s.style.left=(4+k*12)%96+'%';s.style.animationDuration=(16+(k*7)%11)+'s';s.style.animationDelay=-(k*3)%16+'s';$('fx').appendChild(s);}

/* ===== 역사 퀴즈 ===== */
function quizHome(){
  clearInterval(tm);name='';
  app.innerHTML=`<div class="center"><div style="font-size:40px;letter-spacing:8px">💾📁💿</div><div class="big">🖥️</div><div class="msg"><b>역사 퀴즈</b></div>
  <input class="in" id="nm" type="text" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off">
  <div class="lb">문제 수 (1~${ALL.length}개)</div>
  <input class="in" id="cn" type="number" min="1" max="${ALL.length}" value="5" inputmode="numeric">
  <div class="err" id="err"></div><button class="btn" id="go">시작하기</button></div>`;
  const err=t=>$('err').textContent=t;
  const go=()=>{const v=$('nm').value.trim(),n=parseInt($('cn').value,10);
    if(!v){err('이름을 먼저 입력해 주세요!');$('nm').focus();return;}
    if(!(n>=1&&n<=ALL.length)){err('문제 수는 1~'+ALL.length+' 사이로 입력해 주세요!');$('cn').focus();return;}
    name=v;N=n;quizStart();};
  $('go').onclick=go;
  [$('nm'),$('cn')].forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter')go();});
}
function quizStart(){Q=shuffle(ALL).slice(0,N);i=0;score=0;log=[];quizShow();}
function quizShow(){
  const d=Q[i];
  app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="step">${i+1} / ${Q.length} 문제</div>
  <div style="width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:#f3d9d5;display:flex;align-items:center;justify-content:center;font-size:56px">${d.ic}</div>
  <p class="q">${d.q}</p>
  ${d.o.map((t,k)=>`<button class="opt" data-k="${k}">${k+1}. ${t}</button>`).join('')}
  <div class="fb" id="fb"></div>
  <button class="btn" id="next" style="display:none">${i==Q.length-1?'결과 보기':'다음 문제'}</button>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>quizPick(+b.dataset.k));
}
function quizPick(k){
  const d=Q[i],right=k===d.a;
  if(right)score++;
  log.push(right);
  app.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===d.a)b.classList.add('ok');else if(n===k)b.classList.add('no');});
  const fb=$('fb');
  fb.style.color=right?'var(--ok)':'var(--no)';
  fb.textContent=(right?'✔ 정답! ':'✖ 아쉬워요. ')+d.e;
  const nx=$('next');
  nx.style.display='block';
  nx.onclick=()=>{i++;i<Q.length?quizShow():quizResult();};
}
function quizResult(){
  const pt=Math.round(score*100/Q.length);
  const m=score==Q.length?'🎉 완벽해요! 역사 박사님!':pt>=60?'👏 잘했어요!':'💪 다시 도전해 볼까요?';
  app.innerHTML=`<div class="center"><div style="font-size:64px">${pt>=80?'✅':pt>=60?'ℹ️':'⚠️'}</div><div class="step">퀴즈 끝!</div>
  <div class="msg"><b>${esc(name)}</b>님,</div>
  <div class="big">${pt}점</div>
  <div class="msg">이에요! ${Q.length}문제 중 <b>${score}문제</b>를 맞혔어요</div>
  <div class="msg">${m}</div></div>
  <ul class="list">${Q.map((d,n)=>`<li>${log[n]?'✔':'✖'} ${n+1}. ${d.o[d.a]}</li>`).join('')}</ul>
  <button class="btn" id="re">홈으로</button>
  <div class="step center" style="margin:10px 0 0"><span id="cd">5</span>초 뒤 홈으로 돌아가요</div>`;
  $('re').onclick=quizHome;
  clearInterval(tm);
  let t=5;
  tm=setInterval(()=>{t--;if(t<=0){quizHome();}else{$('cd').textContent=t;}},1000);
}

/* ===== 슈퍼스타 야구 3D ===== */
let BB={d:1,n:3};
function baseballMenu(){
  app.innerHTML=`<div class="center"><div style="font-size:56px">⚾</div><div class="msg"><b>슈퍼스타 야구 3D</b><br>초에는 타자, 말에는 투수가 돼요!</div>
  <div class="lb">난이도</div><div style="display:flex;gap:6px;margin-bottom:10px">${['쉬움','보통','어려움'].map((n,k)=>`<button class="opt bd" data-k="${k}" style="margin:0;text-align:center">${n}</button>`).join('')}</div>
  <div class="lb">이닝 수</div><div style="display:flex;gap:6px;margin-bottom:12px">${[1,3,5].map(n=>`<button class="opt bn" data-n="${n}" style="margin:0;text-align:center">${n}회</button>`).join('')}</div>
  <button class="btn" id="bgo">경기 시작!</button>
  <div class="step" style="margin-top:10px;line-height:1.6;text-align:left">⚔️ <b>타자</b>: 💪풀스윙(멀리·어려움) / 🎯컨택(정확·쉬움)을 고르고, 초록 링이 맞을 때 화면을 눌러 스윙! 친 뒤엔 <b>1루·2루·3루·홈</b> 버튼으로 주자를 보내요. 주자가 나가면 <b>🏃도루</b>(성공 50%)도 할 수 있어요.<br>🛡️ <b>투수</b>: 구종을 고르고 던질 칸을 눌러요. ⚡퀵모션은 빨리 던져 도루를 막지만 제구가 흔들려요. 야수는 자동이에요.</div></div>`;
  const mark=()=>{
    app.querySelectorAll('.bd').forEach(b=>b.classList.toggle('ok',+b.dataset.k===BB.d));
    app.querySelectorAll('.bn').forEach(b=>b.classList.toggle('ok',+b.dataset.n===BB.n));
  };
  app.querySelectorAll('.bd').forEach(b=>b.onclick=()=>{BB.d=+b.dataset.k;mark();});
  app.querySelectorAll('.bn').forEach(b=>b.onclick=()=>{BB.n=+b.dataset.n;mark();});
  mark();
  $('bgo').onclick=()=>baseballStart(BB.d,BB.n);
}
function baseballStart(d,N){
  if(typeof THREE==='undefined'){
    app.innerHTML='<div class="center"><div class="msg">3D 엔진을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div><button class="btn" id="bmn0">설정으로</button></div>';
    $('bmn0').onclick=baseballMenu;return;
  }

      const gk=S.top?'cpu':'me',gv=dg[gk],full=gv>=100;
      ctx.font='bold 11px Tahoma,sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
      const lb=(S.top?'상대 수비 ':'내 수비 ')+'🤿 다이빙'+(full?' 준비 완료!':'');
      ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(lb,8,H-24);ctx.fillStyle=full?'#ffe14d':'#fff';ctx.fillText(lb,8,H-24);
      ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,H-18,130,10);
      ctx.fillStyle=full?(Math.floor(t*6)%2?'#ffe14d':'#ff9a1f'):'#3cb4ff';ctx.fillRect(9,H-17,128*Math.min(1,gv/100),8);
    }
    if(t<msgUntil&&msg){
      ctx.textAlign='center';ctx.textBaseline='middle';
      let fs=22;ctx.font='bold '+fs+'px Tahoma,sans-serif';
      while(ctx.measureText(msg).width>330&&fs>11){fs--;ctx.font='bold '+fs+'px Tahoma,sans-serif';}
      ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(msg,210,26);ctx.fillStyle=msgCol;ctx.fillText(msg,210,26);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
    }
  };
  const render=(t,dt)=>{
    if(camMode==='bat'){camPos.x=0;camPos.y=3.8;camPos.z=7.8;look.x=0;look.y=-2.3;look.z=-15;}
    else if(camMode==='end'){camPos.x=0;camPos.y=3.4;camPos.z=-3.2;look.x=0;look.y=1.8;look.z=-15;}
    else{
      const k=1-Math.exp(-3*dt);
      camPos.x+=(0-camPos.x)*k;camPos.y+=(26-camPos.y)*k;camPos.z+=(38-camPos.z)*k;
      let tx=0,tz=-22;
      if(play&&ballM.visible){tx=ballM.position.x*.5;tz=-22+(ballM.position.z+22)*.45;}
      look.x+=(tx-look.x)*k;look.y+=(0-look.y)*k;look.z+=(tz-look.z)*k;
    }
    const dv=play&&play.dive&&!play.ended&&play.t>play.tc-1.0&&play.t<play.tc+1.6;
    if(dv){camPos.x=play.cx-play.ddz*7-play.ddx*3;camPos.y=2.1;camPos.z=play.cz+play.ddx*7-play.ddz*3;look.x=play.cx;look.y=.7;look.z=play.cz;}
    {const wf=dv?42:camMode==='bat'?34:camMode==='end'?48:56;if(cam.fov!==wf){cam.fov=wf;cam.updateProjectionMatrix();}}
    cam.position.set(camPos.x,camPos.y,camPos.z);cam.lookAt(look.x,look.y,look.z);cam.updateMatrixWorld();
    if(camMode==='bat'){
      const pj=(x,y)=>{v3.set(x,y,0).project(cam);return[(v3.x+1)/2*W,(1-v3.y)/2*H];};
      const a=pj(ZX(0)-.1,ZY(0)+.115),b=pj(ZX(4)+.1,ZY(4)-.115);
      zr={x0:a[0],y0:a[1],cw:(b[0]-a[0])/5,ch:(b[1]-a[1])/5};
    }
    if(ending){endAnim(t);renderer.render(scene,cam);drawOv(t);return;}
    // 투수: 와인드업 → 릴리스 → 팔로스루
    const pf=fl[0];
    if(ph==='windup')pitchPose(pf,clamp((t-wuT0)/wuDur,0,1),pend&&pend.q);
    else if(ph==='flight'&&pitch)followPose(pf,clamp((t-pitch.t0)/.5,0,1),pitch.quick);
    else if(!play)idlePose(pf);
    // 포수: 공 높이/방향으로 글러브 이동 + 포구 반동
    const cc=fl[1];
    if(!play){
      if(ph==='flight'&&pitch){
        const k2=1-Math.exp(-8*dt),a2=t-pitch.t0-pitch.dur;
        cc.g.position.x+=(pitch.E.x*.8-cc.g.position.x)*k2;
        cc.ua[1].rotation.x=-(1.1+clamp((pitch.E.y-.2)*.9,0,1.2))+(a2>0&&a2<.2?.35*Math.sin(a2/.2*Math.PI):0);
      }else{cc.g.position.x+=(0-cc.g.position.x)*(1-Math.exp(-4*dt));cc.ua[1].rotation.x=-1.3;}
    }
    // 심판 콜
    if(umpA){
      const u=t-umpA.t0;idlePose(um);
      if(u<1.2){
        if(umpA.k==='strike'||umpA.k==='out'){um.ua[0].rotation.set(.3,0,-2.9);um.fa[0].rotation.z=-1.4;}
        else if(umpA.k==='foul'){um.ua[0].rotation.set(0,0,-3);um.ua[1].rotation.set(0,0,3);}
      }else umpA=null;
    }
    // 타자 스윙: 하체 → 상체 → 배트 순서로 회전
    if(!play){
      const b0=rn[0];stancePose(b0);
      if(swingA){
        const full=swingA.full,dur=full?.3:.24,u=clamp((t-swingA.t0)/dur,0,1),e=Math.pow(u,1.4);
        const a0=full?-1.7:-1.4,a1=full?1.4:1.2;
        batSet(a0+(a1-a0)*e,-1.0+.85*Math.min(1,u*2.2));
        b0.pel.rotation.y=-.15+1.5*e;b0.tor.rotation.y=-.35+1.2*e;
        b0.ua[0].rotation.x=-1.0+.25*e;b0.ua[1].rotation.x=-.95+.25*e;
        b0.th[0].rotation.x=-.15-.3*e;b0.sh[0].rotation.x=.4-.2*e;
      }else batSet(-1.4,-1.0);
    }
    // 도루 주자
    if(stealAnim&&!play&&pitch){
      const st=stealAnim,u=t-st.t0,ms=baseMesh[st.b];
      if(ms){
        const T=st.ok?pitch.dur+.75:pitch.dur+1.45,endOut=pitch.dur+1.1,f=Math.min(1,u/T);
        if(!st.ok&&u>endOut)ms.g.visible=false;
        const q=posXZ(st.b+1+LEAD+(1-LEAD)*f);
        ms.g.position.set(q[0],0,q[1]);ms.g.rotation.y=q[2];
        if(f<1&&(st.ok||u<=endOut))runPose(ms,u*13);else idlePose(ms);
      }
    }
    // 공
    if(!play){
      const st=stealAnim,tsw=(st&&pitch)?t-st.t0-(pitch.dur+.25):-1;
      if(st&&tsw>=0&&tsw<.8){
        const e=tsw/.8,bp=BP[st.b+2];
        ballM.visible=true;ballM.position.set(bp[0]*e,1.2+Math.sin(e*Math.PI)*1.2,2.2+(bp[1]-2.2)*e);
      }else if(ph==='windup'){
        const p=clamp((t-wuT0)/wuDur,0,1);
        ballM.visible=true;
        if(p<.7)ballM.position.set(0,1.25,-14.8);else ballM.position.set(-.3,2.0,-15.1);
      }else if(ph==='flight'&&pitch){const p=pitchPos(t);ballM.visible=true;ballM.position.set(p[0],p[1],p[2]);}
      else if(ph==='res'&&pitch&&t-pitch.t0-pitch.dur<.35){const p=pitchPos(t);ballM.visible=true;ballM.position.set(p[0],p[1],p[2]);}
      else ballM.visible=false;
    }
    renderer.render(scene,cam);
    drawOv(t);
  };

  const loop=()=>{
    if(!document.body.contains(cv3)){renderer.dispose();window.removeEventListener('keydown',kd);return;}
    const t=now(),dt=clamp(t-lastT,0,.05);lastT=t;
    if(winEl.style.display!=='none'){
      if(ph==='ready'&&t>=phT&&S.top&&!over)startCpuPitch();
      if(ph==='windup'&&t>=wuT0+wuDur)release();
      if(ph==='flight'&&pitch&&!pitch.bat&&!pitch.dec&&t-pitch.t0>=pitch.dur-.13)cpuDec(pitch);
      if(ph==='flight'&&pitch&&!pitch.done&&t-pitch.t0>=pitch.dur){
        pitch.done=true;pitch.bat?resolveBat(pitch):resolveCpu(pitch);
        dgAdd(8);
        if(ph==='res'&&stealReq)applySteal();
      }
      if(ph==='play')upPlay(play&&play.dive&&play.t>play.tc-1.0&&play.t<play.tc+1.6?dt*.45:dt);
      if(S.outs>lastOuts)dgAdd(20*(S.outs-lastOuts));
      lastOuts=S.outs;
      if(ph==='res'&&t>=phT){
        ph='ready';phT=t+.7;
        if(S.pend==='half'){S.pend=null;switchHalf();}
        else placeBase();
      }
    }
    render(t,dt);sb();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ===== 탕탕특공대 (자동 사격 서바이벌) ===== */
function tangStart(){
  const W=420,H=420,WIN_T=180;
  app.innerHTML=`<div class="center"><div class="msg" style="margin:0 0 6px"><b>🔫 탕탕특공대</b></div>
  <div style="position:relative;border:2px solid #003c74;background:#1d2a1d">

    <div id="tjs" style="position:absolute;left:10px;bottom:10px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.7);touch-action:none;user-select:none">
      <div id="tjt" style="position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid #fff;pointer-events:none"></div></div>
    <div id="tlv" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.75);flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;z-index:5"></div>
  </div>
  <div class="step" style="margin:8px 0 0;line-height:1.5">조이스틱(또는 WASD·방향키)으로 몬스터를 피하세요! 총은 자동으로 쏴요 🔫<br>경험치 💎를 모아 레벨업 → 능력 선택 · 내 몸을 두른 <b>자기장 🌐</b>은 레벨업으로 최대 <b>6레벨</b>까지 넓어져요! 끝없이 버텨 보세요 (최고 기록 도전)</div>
  <div id="tmo" style="margin-top:8px"></div></div>`;
  const cv=$('tg'),ctx=cv.getContext('2d'),R=Math.random;
  const P={x:0,y:0,hp:120,mhp:120,spd:135,r:12,lv:1,xp:0,need:4,inv:0,face:1};
  const wp={dmg:12,rate:.5,cnt:1,pierce:0,speed:340,range:290,blades:0,magnet:80,field:1};
  const FR=[0,62,82,104,128,154,182];let fieldT=0,fieldAng=0;
  let enemies=[],bullets=[],gems=[],parts=[],drops=[];
  let time=0,kills=0,paused=false,over=false,cd=0,spT=1,nextBoss=55,bang=0,bladeAng=0,pendingLv=0,choices=[];
  let jx=0,jy=0,jid=null;const keys={};
  const ET={
    slime:{e:'👾',hp:10,spd:42,dmg:6,r:12,xp:1},
    wolf:{e:'🐺',hp:8,spd:78,dmg:5,r:11,xp:1},
    boar:{e:'🐗',hp:46,spd:32,dmg:11,r:16,xp:3},
    boss:{e:'👹',hp:480,spd:36,dmg:18,r:30,xp:30}
  };
  const UP=[
    {id:'dmg',i:'🔫',n:'공격력 UP',d:'총알 피해 +30%',f:()=>{wp.dmg*=1.3;}},
    {id:'rate',i:'⚡',n:'연사 UP',d:'발사 속도 +20%',f:()=>{wp.rate*=.82;}},
    {id:'cnt',i:'🔱',n:'다중 발사',d:'한 번에 총알 +1발',max:6,f:()=>{wp.cnt++;}},
    {id:'prc',i:'💥',n:'관통탄',d:'총알이 적을 1명 더 관통',max:5,f:()=>{wp.pierce++;}},
    {id:'bld',i:'🌀',n:'회전 칼날',d:'몸 주변을 도는 칼날 +1',max:6,f:()=>{wp.blades++;}},
    {id:'spd',i:'👟',n:'이동속도 UP',d:'이동속도 +12%',f:()=>{P.spd*=1.12;}},
    {id:'fld',i:'🌐',n:'자기장 UP',nm:true,d:()=>'자기장 반경 '+FR[wp.field]+' → '+FR[wp.field+1]+' · 피해·감속 증가 (Lv '+wp.field+'→'+(wp.field+1)+' / 6)',max:5,f:()=>{wp.field++;}},
    {id:'hp',i:'❤️',n:'체력 UP',d:'최대 체력 +30 · 30 회복',f:()=>{P.mhp+=30;P.hp=Math.min(P.mhp,P.hp+30);}},
    {id:'mag',i:'🧲',n:'자석 UP',d:'경험치 자석 범위 +60%',f:()=>{wp.magnet*=1.6;}},
    {id:'rng',i:'🎯',n:'사거리 UP',d:'사거리 +20%',f:()=>{wp.range*=1.2;}}
  ];
  const have={};
  const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');

  /* 조이스틱 + 키보드 */
  const jb=$('tjs'),jt=$('tjt');
  const jset=e=>{
    const r=jb.getBoundingClientRect(),Rr=r.width/2-8;
    let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const dd=Math.hypot(dx,dy);if(dd>Rr){dx=dx/dd*Rr;dy=dy/dd*Rr;}
    jt.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/Rr;jy=dy/Rr;
  };
  jb.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;jb.setPointerCapture(e.pointerId);jset(e);});
  jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e);});
  ['pointerup','pointercancel'].forEach(ev=>jb.addEventListener(ev,e=>{if(e.pointerId===jid){jid=null;jx=jy=0;jt.style.transform='';}}));
  const kd=e=>{
    const m={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'}[e.key];
    if(!m)return;
    if(winEl.style.display!=='none')e.preventDefault();
    keys[m]=e.type==='keydown';
  };
  window.addEventListener('keydown',kd);window.addEventListener('keyup',kd);

  /* 스폰 */
  const pickType=()=>{
    const r=R();
    if(time>45&&r<.2)return 'boar';
    if(time>15&&r<.5)return 'wolf';
    return 'slime';
  };
  const spawn=k=>{
    const t=ET[k],a=R()*Math.PI*2,d=270+R()*40,sf=1+time/90;
    enemies.push({k,e:t.e,x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,hp:t.hp*sf,mhp:t.hp*sf,spd:t.spd*(1+Math.min(1,time/600)),dmg:t.dmg*(1+Math.min(2,time/300)),r:t.r,xp:t.xp,fl:0,bt:0});
  };
  const levelPrompt=()=>{
    const pool=UP.filter(u=>!u.max||(have[u.id]||0)<u.max);
    choices=[];
    while(choices.length<3&&pool.length){choices.push(pool.splice(Math.floor(R()*pool.length),1)[0]);}
    if(wp.field<6&&!choices.some(c=>c.id==='fld')&&R()<.5){const fu=UP.find(u=>u.id==='fld');choices[0]=fu;}
    paused=true;
    const box=$('tlv');box.style.display='flex';box.innerHTML='<div style="color:#ffe14d;font-weight:700;font-size:20px;text-shadow:1px 1px 2px #000">⭐ 레벨 '+P.lv+'! 능력을 고르세요</div>';
    choices.forEach((u,k)=>{
      const b=document.createElement('button');
      b.style.cssText='width:100%;max-width:320px;text-align:left;padding:10px 12px;font-size:15px;font-weight:700;color:#111;background:linear-gradient(#fff,#e6e2cf);border:2px solid #003c74;border-radius:6px;cursor:pointer';
      b.innerHTML=u.i+' '+u.n+'<br><span style="font-size:12px;font-weight:400">'+(typeof u.d==='function'?u.d():u.d)+(u.max&&!u.nm?' ('+(have[u.id]||0)+'/'+u.max+')':'')+'</span>';
      b.onclick=()=>choose(k);
      box.appendChild(b);
    });
  };
  const choose=k=>{
    const u=choices[k];if(!u||!paused)return;
    u.f();have[u.id]=(have[u.id]||0)+1;
    pendingLv--;
    if(pendingLv>0){levelPrompt();return;}
    $('tlv').style.display='none';paused=false;
  };
  const addXp=v=>{
    P.xp+=v;
    while(P.xp>=P.need){P.xp-=P.need;P.lv++;P.need=Math.floor(P.need*1.25+2);pendingLv++;}
    if(pendingLv>0&&!paused)levelPrompt();
  };
  const hurt=(e,dmg)=>{e.hp-=dmg;e.fl=.08;};
  let best=0;try{best=+localStorage.getItem('hos_tang_best')||0;}catch(e){}
  const finish=()=>{
    over=true;
    const nb=Math.floor(time)>best;
    if(nb){best=Math.floor(time);try{localStorage.setItem('hos_tang_best',String(best));}catch(e){}}
    $('tmo').innerHTML=`<div style="font-weight:700;font-size:18px;color:#c62828;margin-bottom:6px">💀 쓰러졌어요...</div><div class="step" style="margin-bottom:4px">버틴 시간 ${fmt(time)} · 처치 ${kills}마리 · 레벨 ${P.lv}</div><div class="step" style="margin-bottom:8px;color:#c0392b;font-weight:700">🏅 최고 기록 ${fmt(best)}${nb?' (새 기록!)':''}</div><button class="btn" id="tre">다시 하기</button><button class="btn" id="thm" style="margin-top:8px">홈으로</button>`;
    $('tre').onclick=tangStart;$('thm').onclick=()=>{$('tlv').style.display='none';if($('bx').onclick)$('bx').onclick();};
  };

  /* 업데이트 */
  const update=dt=>{
    time+=dt;
    let mx=jx+(keys.r?1:0)-(keys.l?1:0),my=jy+(keys.d?1:0)-(keys.u?1:0);
    const ml=Math.hypot(mx,my);
    if(ml>.15){const s=Math.min(1,ml);P.x+=mx/ml*s*P.spd*dt;P.y+=my/ml*s*P.spd*dt;if(Math.abs(mx)>.2)P.face=mx>0?1:-1;}
    P.inv=Math.max(0,P.inv-dt);
    // 자동 사격
    cd-=dt;
    if(cd<=0){
      let tg=null,bd=wp.range*wp.range;
      for(const e of enemies){const d2=(e.x-P.x)**2+(e.y-P.y)**2;if(d2<bd){bd=d2;tg=e;}}
      if(tg){
        cd=wp.rate;bang=.1;
        const a0=Math.atan2(tg.y-P.y,tg.x-P.x);
        for(let i=0;i<wp.cnt;i++){
          const a=a0+(i-(wp.cnt-1)/2)*.14;
          bullets.push({x:P.x,y:P.y,vx:Math.cos(a)*wp.speed,vy:Math.sin(a)*wp.speed,dmg:wp.dmg,pi:wp.pierce,life:wp.range/wp.speed,hit:new Set()});
        }
      }
    }
    bang=Math.max(0,bang-dt);
    // 총알
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      let dead=b.life<=0;
      if(!dead)for(const e of enemies){
        if(b.hit.has(e))continue;
        if((e.x-b.x)**2+(e.y-b.y)**2<=(e.r+4)**2){hurt(e,b.dmg);b.hit.add(e);if(b.pi--<=0){dead=true;break;}}
      }
      if(dead)bullets.splice(i,1);
    }
    // 회전 칼날
    bladeAng+=3.2*dt;
    for(let k=0;k<wp.blades;k++){
      const a=bladeAng+k*Math.PI*2/wp.blades,bx=P.x+Math.cos(a)*56,by=P.y+Math.sin(a)*56;
      for(const e of enemies)if(e.bt<=time&&(e.x-bx)**2+(e.y-by)**2<=(e.r+10)**2){hurt(e,wp.dmg*.9);e.bt=time+.35;}
    }
    // 스폰
    spT-=dt;
    while(spT<=0){spT+=Math.max(.14,1.0-time/190);if(enemies.length<230)spawn(pickType());}
    if(time>=nextBoss){spawn('boss');nextBoss+=55;}
    // 자기장: 몸을 두른 장판 (안에 있는 적에게 계속 피해 + 감속)
    fieldAng+=2.2*dt;fieldT-=dt;
    {
      const fr=FR[wp.field],tick=fieldT<=0;
      if(tick)fieldT=.45;
      for(const e of enemies){
        e.slow=(e.x-P.x)**2+(e.y-P.y)**2<(fr+e.r)**2;
        if(tick&&e.slow)hurt(e,wp.dmg*(.5+.12*wp.field));
      }
    }
    // 적
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i],dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
      e.fl=Math.max(0,e.fl-dt);
      if(d>e.r+P.r-2){const sp=e.spd*(e.slow?.7:1);e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;}
      if(d<e.r+P.r&&P.inv<=0){P.hp-=e.dmg;P.inv=.75;}
      if(d>700){enemies.splice(i,1);continue;}
      if(e.hp<=0){
        kills++;
        gems.push({x:e.x,y:e.y,v:e.xp});
        if(e.k==='boss'){for(let k=0;k<6;k++)gems.push({x:e.x+(R()-.5)*50,y:e.y+(R()-.5)*50,v:4});drops.push({x:e.x,y:e.y});}
        else if(R()<.025)drops.push({x:e.x,y:e.y});
        for(let k=0;k<5;k++)parts.push({x:e.x,y:e.y,vx:(R()-.5)*160,vy:(R()-.5)*160,life:.35});
        enemies.splice(i,1);
      }
    }
    // 경험치/회복 아이템
    for(let i=gems.length-1;i>=0;i--){
      const g=gems[i],dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
      if(d<wp.magnet){g.x+=dx/d*260*dt;g.y+=dy/d*260*dt;}
      if(d<16){gems.splice(i,1);addXp(g.v);}
    }
    for(let i=drops.length-1;i>=0;i--){
      const g=drops[i];
      if(Math.hypot(P.x-g.x,P.y-g.y)<20){drops.splice(i,1);P.hp=Math.min(P.mhp,P.hp+25);}
    }
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
    if(P.hp<=0){P.hp=0;finish(false);}
  };

  /* 그리기 */
  const draw=()=>{
    const ox=W/2-P.x,oy=H/2-P.y;
    ctx.fillStyle='#27402a';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
    const gx=((ox%60)+60)%60,gy=((oy%60)+60)%60;
    for(let x=gx;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=gy;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    {
      const fr=FR[wp.field];
      ctx.save();ctx.translate(W/2,H/2);
      ctx.fillStyle='rgba(80,200,255,.16)';ctx.beginPath();ctx.arc(0,0,fr,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(150,230,255,.9)';ctx.lineWidth=2+wp.field*.4;ctx.beginPath();ctx.arc(0,0,fr,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;
      const n=3+wp.field;
      for(let k=0;k<n;k++){const a=fieldAng+k*Math.PI*2/n;ctx.beginPath();ctx.arc(0,0,fr-4,a,a+.35);ctx.stroke();}
      ctx.restore();
    }
    ctx.textAlign='center';ctx.textBaseline='middle';
    gems.forEach(g=>{ctx.fillStyle='#5be0ff';ctx.beginPath();ctx.arc(g.x+ox,g.y+oy,4+Math.min(3,g.v),0,7);ctx.fill();});
    ctx.font='20px serif';drops.forEach(g=>ctx.fillText('🍖',g.x+ox,g.y+oy));
    enemies.forEach(e=>{
      const sx=e.x+ox,sy=e.y+oy;
      if(sx<-40||sx>W+40||sy<-40||sy>H+40)return;
      ctx.font=Math.round(e.r*2.1)+'px serif';
      if(e.fl>0){ctx.globalAlpha=.5;}
      ctx.fillText(e.e,sx,sy);ctx.globalAlpha=1;
      if(e.k==='boss'||e.k==='boar'){ctx.fillStyle='#400';ctx.fillRect(sx-e.r,sy-e.r-8,e.r*2,4);ctx.fillStyle='#f33';ctx.fillRect(sx-e.r,sy-e.r-8,e.r*2*Math.max(0,e.hp/e.mhp),4);}
    });
    ctx.fillStyle='#ffe14d';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x+ox,b.y+oy,4,0,7);ctx.fill();});
    ctx.font='22px serif';
    for(let k=0;k<wp.blades;k++){const a=bladeAng+k*Math.PI*2/wp.blades;ctx.fillText('🗡️',P.x+Math.cos(a)*56+ox,P.y+Math.sin(a)*56+oy);}
    parts.forEach(p=>{ctx.fillStyle='rgba(255,255,255,'+(p.life*2.5)+')';ctx.fillRect(p.x+ox-2,p.y+oy-2,4,4);});
    // 플레이어
    if(!(P.inv>0&&Math.floor(P.inv*14)%2)){
      ctx.font='28px serif';ctx.save();ctx.translate(W/2,H/2);ctx.scale(P.face,1);ctx.fillText('🪖',0,0);ctx.restore();
      if(bang>0){ctx.font='18px serif';ctx.fillText('💥',W/2+P.face*20,H/2-4);}
    }
    // HUD
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,8);ctx.fillStyle='#4aa8ff';ctx.fillRect(0,0,W*P.xp/P.need,8);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,14,130,12);ctx.fillStyle='#e03a3a';ctx.fillRect(8,14,130*P.hp/P.mhp,12);
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='bold 12px Tahoma,sans-serif';ctx.textAlign='left';
    const hpt='HP '+Math.ceil(P.hp)+'/'+P.mhp;ctx.strokeText(hpt,12,21);ctx.fillText(hpt,12,21);
    ctx.textAlign='center';ctx.font='bold 16px Tahoma,sans-serif';
    ctx.strokeText(fmt(time),W/2,38);ctx.fillText(fmt(time),W/2,38);
    ctx.textAlign='right';ctx.font='bold 12px Tahoma,sans-serif';
    const rt='Lv.'+P.lv+'  처치 '+kills;ctx.strokeText(rt,W-8,21);ctx.fillText(rt,W-8,21);
    const ft='🌐 자기장 Lv.'+wp.field+(wp.field>=6?' MAX':'');ctx.strokeText(ft,W-8,38);ctx.fillText(ft,W-8,38);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  };

  let last=performance.now();
  const loop=t=>{
    if(!document.body.contains(cv)){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',kd);return;}
    const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
    if(!paused&&!over&&winEl.style.display!=='none')update(dt);
    draw();requestAnimationFrame(loop);
  };
  globalThis.__tangDbg&&globalThis.__tangDbg({P,wp,get enemies(){return enemies;},get choices(){return choices;},choose,get paused(){return paused;},get over(){return over;},get time(){return time;},get kills(){return kills;},get bullets(){return bullets;},get gems(){return gems;}});
  requestAnimationFrame(loop);
}

/* ===== 바탕화면 / 창 관리 ===== */
const APPS={quiz:{n:'역사 퀴즈',i:'📜',run:quizHome},base:{n:'슈퍼스타 야구 3D',i:'⚾',run:baseballMenu},tang:{n:'탕탕특공대',i:'🔫',run:tangStart}};
Object.entries(APPS).forEach(([id,a])=>{
  const d=document.createElement('div');d.className='icon';d.innerHTML='<div>'+a.i+'</div>'+a.n;
  d.onclick=()=>openApp(id);dsk.appendChild(d);
});
function setWin(v){winEl.style.display=v?'':'none';dsk.style.display=v?'none':'flex';tk.style.display=cur?'':'none';}
function openApp(id){
  clearInterval(tm);cur=id;const a=APPS[id];
  $('ttl').textContent=a.n+'.exe';tk.textContent=a.i+' '+a.n+'.exe';
  setWin(true);
  app.innerHTML=`<div class="center" style="padding:24px 0">${LOGO}<div class="msg"><b>${a.n}</b> 로딩 중...</div><div class="ld"><i></i></div></div>`;
  setTimeout(()=>{if(cur===id)a.run();},1300);
}
$('bx').onclick=()=>{clearInterval(tm);cur=null;setWin(false);};
$('bmin').onclick=()=>setWin(false);
$('bmax').onclick=()=>wrapEl.classList.toggle('max');
tk.onclick=()=>{if(cur)setWin(winEl.style.display==='none');};
const tick=()=>{$('clk').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});};
tick();setInterval(tick,30000);

/* 시작 메뉴 + 전원 */
const sm=$('sm');
sm.innerHTML='<div class="sh">🖥️ 역사 OS</div>'+Object.entries(APPS).map(([id,a])=>`<div class="si" data-id="${id}">${a.i} ${a.n}</div>`).join('')+'<div class="sf"><button class="pwb" id="pwb" title="전원">⏻</button><span>전원</span></div>';
sm.querySelectorAll('.si').forEach(d=>d.onclick=()=>openApp(d.dataset.id));
$('st').onclick=e=>{e.stopPropagation();sm.style.display=sm.style.display==='block'?'none':'block';};
document.addEventListener('click',()=>{sm.style.display='none';});
$('pwb').onclick=()=>{$('dlg').style.display='flex';};
$('dno').onclick=()=>{$('dlg').style.display='none';};
$('dok').onclick=()=>{
  $('dlg').style.display='none';
  clearInterval(tm);cur=null;wrapEl.classList.remove('max');setWin(false);app.innerHTML='';
  $('off').style.display='block';$('offt').style.display='block';$('pw').style.display='none';
  setTimeout(()=>{$('offt').style.display='none';$('pw').style.display='block';},1400);
};
$('pw').onclick=()=>{$('off').style.display='none';boot();};

/* 부팅 화면 */
function boot(){
  const b=$('boot');b.style.display='flex';b.style.opacity=1;
  setTimeout(()=>{b.style.opacity=0;setTimeout(()=>{b.style.display='none';},500);},3200);
}
document.addEventListener('gesturestart',e=>e.preventDefault());
boot();
</script>
